# Build and test on every push and pull request, on the three platforms the
# releases are made for. The release workflow repeats these steps on a tag
# and packages the result.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ayzek (third_party/ayzek) is C++23 and is compiled with zig through
      # Meson; see third_party/CMakeLists.txt and packaging/ayzek/.
      - name: zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Meson
        shell: bash
        run: |
          # pip puts meson in the user scripts directory of the Python that
          # ran it; a later step (the Qt action) may switch Python, so put
          # that directory on PATH and let CMake find the meson executable.
          if [ "$RUNNER_OS" = "macOS" ]; then brew install meson
          else
            python3 -m pip install --user meson==1.12.1
            python3 -c "import os, sysconfig; print(sysconfig.get_path('scripts', os.name + '_user'))" >> "$GITHUB_PATH"
          fi

      - name: Drop the Microsoft apt repository
        if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-12 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKG_BUNDLE_AYZEK=ON

      - name: Build
        run: cmake --build build

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure || ctest --test-dir build --rerun-failed -V
        env:
          QT_QPA_PLATFORM: offscreen
          # QtTest on Windows logs to the debugger when stdout is a pipe.
          QT_ASSUME_STDERR_HAS_CONSOLE: "1"
